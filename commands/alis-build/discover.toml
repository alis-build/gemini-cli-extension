description = "Find and load the right Alis Build skill for platform work (build, fix, deploy, protos, neurons, Spanner, Terraform)."
prompt = """
Run the Alis Build skill-discovery router. You are routing, not executing: find the best registry skill for the task, load it, and hand execution over to it.

1. Infer the intended outcome from the current request and workspace context (current directory, visible errors, recent conversation). Ask at most ONE concise clarifying question, and only if the goal is genuinely ambiguous — otherwise proceed.

2. Search the registry: `alis skills search "<intended outcome>" --limit 8` (add `--json` when parsing the results programmatically). The search IS the discovery mechanism — never list or page through the whole catalogue.

3. Present the matches: for each, give the id, what it does, and when to choose it. Recommend one and say why. (`alis skills preview <id>` shows a skill's full description if I want a closer look before loading.)

4. Load the chosen skill and follow it: `alis skills load <id> --via dispatcher`. From this point the loaded skill owns execution — follow its workflow, not your own plan.

Rules:
- For platform-shaped work: do not inspect or edit code, run Define / Build / Deploy, or make commits before a skill is loaded. Route first.
- If nothing fits, say so and offer to file it: `alis skills request --name "..." --description "..."`. Then plant the capture seed in one sentence: "If we end up solving this by hand in this session, say 'capture this as a skill' afterwards and I'll save it for your team."
- If `alis skills search` fails or the `alis` CLI is absent, say so plainly and continue helping without a skill — never block on discovery.
"""
