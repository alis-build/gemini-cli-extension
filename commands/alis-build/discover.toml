description = "Find and load the right Alis Build skill for platform work (build, fix, deploy, protos, neurons, Spanner, Terraform)."
prompt = """
Run the Alis Build skill-discovery router — route quietly: find the best skill, load it, and hand execution over to it, with no preamble about running discovery.

1. Infer the intended outcome from the current request and workspace context (current directory, visible errors, recent conversation). Ask at most ONE concise clarifying question, and only if the goal is genuinely ambiguous — otherwise proceed.

2. Probe locally (~40ms, no network): `alis skills suggest "<intended outcome>" --json`. A candidate is real only when its `distinctive` score is >= 3 (on a CLI that does not report `distinctive`, require `score` >= 5). Below that, there is no skill — say so briefly and help without one.

3. Unsure between candidates? `alis skills preview <id>` is a cheap fit check before committing to a load.

4. Load the chosen skill and follow it: `alis skills load <id> --via dispatcher`. From this point the loaded skill owns execution — mention it in one clause, then follow its workflow, not your own plan.

5. Registry search is the exception, not the default: `alis skills search "<intended outcome>" --limit 3 --json` only when I explicitly asked to find a skill, or the local probe was genuinely ambiguous. On any failure, fall back to the probe result and continue — never block, never retry.

Rules:
- Discovery runs at most once per task: after a miss, do not re-probe on follow-up prompts about the same piece of work.
- If I asked for a skill and nothing fits, say so and offer to file it: `alis skills request --name "..." --description "..."`.
- If the `alis` CLI is absent, continue helping without a skill.
"""
